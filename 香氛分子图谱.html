<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>香氛分子图谱</title>
  <style>
    :root {
      --bg: #0b1020;
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.62);
      --line: rgba(255,255,255,0.10);
      --chip: rgba(255,255,255,0.10);
      --chipOn: rgba(255,255,255,0.20);
      --shadow: 0 16px 44px rgba(0,0,0,0.40);
      --radius: 16px;
      --radius2: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 20% 0%, rgba(90,120,255,0.22), transparent 60%),
                  radial-gradient(900px 700px at 80% 20%, rgba(0,255,200,0.10), transparent 55%),
                  var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 22px 16px 36px;
      padding-bottom: calc(36px + env(safe-area-inset-bottom));
    }
    header { padding: 8px 2px 10px; }
    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.2px;
      margin: 6px 0 6px;
    }
    .sub {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
      margin: 0 0 12px;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(14px);
      background: linear-gradient(to bottom, rgba(11,16,32,0.86), rgba(11,16,32,0.62));
      border-bottom: 1px solid var(--line);
      padding: 12px 0 10px;
      margin: 0 0 14px;
    }
    .searchRow {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 0 2px 10px;
    }
    .search {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      padding: 12px 12px;
      color: var(--text);
      outline: none;
      font-size: 14px;
    }
    .btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border-radius: 14px;
      padding: 11px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 2px 10px;
      -webkit-overflow-scrolling: touch;
    }
    .chip {
      white-space: nowrap;
      padding: 9px 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.10);
      background: var(--chip);
      color: rgba(255,255,255,0.86);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    .chip.on {
      background: var(--chipOn);
      border-color: rgba(255,255,255,0.18);
    }
    .metaRow {
      display:flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      padding: 0 2px 2px;
      color: var(--muted);
      font-size: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    @media (min-width: 740px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .title { font-size: 26px; }
    }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.05));
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease;
    }
    .card:active { transform: scale(0.99); }
    .thumb {
      width: 100%;
      aspect-ratio: 1.25 / 1;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.14);
      border-bottom: 1px solid var(--line);
    }
    .thumb img {
      max-width: 92%;
      max-height: 92%;
      filter: drop-shadow(0 12px 28px rgba(0,0,0,0.35));
    }
    .body { padding: 10px 10px 12px; }
    .name {
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.2;
      margin: 0 0 6px;
    }
    .name .en {
      font-weight: 600;
      color: rgba(255,255,255,0.72);
      font-size: 12px;
      margin-left: 4px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      font-size: 11px;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.82);
    }
    /* Bottom sheet */
    .sheetMask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.58);
      backdrop-filter: blur(8px);
      display: none;
      z-index: 50;
    }
    .sheetMask.on { display:block; }
    .sheet {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(18,26,54,0.98), rgba(10,14,26,0.98));
      border-top-left-radius: var(--radius2);
      border-top-right-radius: var(--radius2);
      border-top: 1px solid rgba(255,255,255,0.12);
      padding: 14px 16px 18px;
      padding-bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateY(16px);
    }
    .grab {
      width: 46px; height: 5px;
      border-radius: 999px;
      background: rgba(255,255,255,0.24);
      margin: 2px auto 12px;
    }
    .sheetHead {
      display:flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .sheetTitle {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.25;
    }
    .sheetSub {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .close {
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 12px;
      cursor:pointer;
      height: fit-content;
      flex-shrink: 0;
    }
    .panel {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 16px;
      padding: 12px;
      margin-top: 12px;
    }
    .bigImg {
      width: 100%;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.14);
      border-radius: 14px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.10);
    }
    .bigImg img {
      max-width: 100%;
      height: auto;
      filter: drop-shadow(0 14px 32px rgba(0,0,0,0.40));
    }
    .kv {
      display:grid;
      grid-template-columns: 92px 1fr;
      gap: 8px 10px;
      font-size: 13px;
      line-height: 1.35;
      margin-top: 8px;
    }
    .k { color: var(--muted); }
    .v { color: rgba(255,255,255,0.88); word-break: break-all; }
    .copyRow {
      display:flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .miniBtn {
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border-radius: 12px;
      padding: 9px 10px;
      font-size: 12px;
      cursor:pointer;
    }
    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: rgba(0,0,0,0.72);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.92);
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 12px;
      display: none;
      z-index: 80;
    }
    .toast.on { display:block; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title" id="pageTitle"></div>
      <div class="sub" id="pageSub"></div>
    </header>

    <div class="toolbar">
      <div class="searchRow">
        <input id="q" class="search" placeholder="搜索分子名称 / CAS / SMILES / 气味标签…" autocomplete="off" />
        <button id="reset" class="btn">重置</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="metaRow">
        <div id="count"></div>
        <div id="active"></div>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <div style="margin-top:14px;color:rgba(255,255,255,0.55);font-size:12px;line-height:1.55;">
      说明：本页面根据表格数据自动生成，用于移动端展示与检索；如需将“扫码入口”接入礼盒二维码，可将本 HTML 部署为静态网页并生成二维码指向该地址。
    </div>
  </div>

  <div class="sheetMask" id="mask" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-label="分子详情">
      <div class="grab"></div>
      <div class="sheetHead">
        <div>
          <h3 class="sheetTitle" id="dTitle"></h3>
          <div class="sheetSub" id="dSub"></div>
        </div>
        <button class="close" id="close">关闭</button>
      </div>

      <div class="panel">
        <div class="bigImg"><img id="dImg" alt="molecule" /></div>
        <div class="kv">
          <div class="k">CAS</div><div class="v" id="dCas"></div>
          <div class="k">SMILES</div><div class="v" id="dSmiles"></div>
          <div class="k">气味标签</div><div class="v" id="dTags"></div>
        </div>
        <div class="copyRow">
          <button class="miniBtn" id="copyCas">复制 CAS</button>
          <button class="miniBtn" id="copySmiles">复制 SMILES</button>
          <button class="miniBtn" id="copyTags">复制标签</button>
        </div>
        <div class="hint">
          提示：气味标签来自模型预测与规则汇总，供展示与参考之用；在配方评估与合规场景下建议结合专业检测与法规要求。
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

    const $ = (id) => document.getElementById(id);
    const state = {
      q: "",
      tag: "",
      molecules: DATA.molecules,
      tags: DATA.tags
    };

    function zhTag(key) {
      const hit = state.tags.find(t => t.key === key);
      return hit ? hit.label : key;
    }

    function setHeader() {
      $("pageTitle").textContent = DATA.title;
      $("pageSub").textContent = DATA.subtitle;
    }

    function renderChips() {
      const box = $("chips");
      box.innerHTML = "";

      const all = document.createElement("div");
      all.className = "chip" + (state.tag === "" ? " on" : "");
      all.textContent = "全部";
      all.onclick = () => { state.tag = ""; renderChips(); render(); };
      box.appendChild(all);

      state.tags.forEach(t => {
        const el = document.createElement("div");
        el.className = "chip" + (state.tag === t.key ? " on" : "");
        el.textContent = t.label;
        el.title = t.key;
        el.onclick = () => {
          state.tag = (state.tag === t.key) ? "" : t.key;
          renderChips();
          render();
        };
        box.appendChild(el);
      });
    }

    function filterList() {
      const q = state.q.trim().toLowerCase();
      return state.molecules.filter(m => {
        const inTag = !state.tag || (m.tags || []).includes(state.tag);
        if (!inTag) return false;
        if (!q) return true;
        const hay = [
          m.name_full, m.name_cn, m.name_en, m.cas, m.smiles, ...(m.tags || [])
        ].filter(Boolean).join(" ").toLowerCase();
        return hay.includes(q);
      });
    }

    function card(m) {
      const el = document.createElement("div");
      el.className = "card";
      el.onclick = () => openDetail(m);

      const thumb = document.createElement("div");
      thumb.className = "thumb";
      const img = document.createElement("img");
      img.src = m.img || "";
      img.alt = m.name_full || "molecule";
      thumb.appendChild(img);

      const body = document.createElement("div");
      body.className = "body";

      const nm = document.createElement("div");
      nm.className = "name";
      const cn = document.createElement("span");
      cn.textContent = m.name_cn || m.name_full || "";
      nm.appendChild(cn);
      if (m.name_en) {
        const en = document.createElement("span");
        en.className = "en";
        en.textContent = m.name_en;
        nm.appendChild(en);
      }

      const tags = document.createElement("div");
      tags.className = "tags";
      (m.tags || []).slice(0, 4).forEach(t => {
        const tg = document.createElement("div");
        tg.className = "tag";
        tg.textContent = zhTag(t);
        tg.title = t;
        tags.appendChild(tg);
      });

      body.appendChild(nm);
      body.appendChild(tags);

      el.appendChild(thumb);
      el.appendChild(body);
      return el;
    }

    function render() {
      const list = filterList();
      $("count").textContent = "显示 " + list.length + " / " + state.molecules.length;
      $("active").textContent = state.tag ? ("筛选：" + zhTag(state.tag)) : " ";

      const grid = $("grid");
      grid.innerHTML = "";
      list.forEach(m => grid.appendChild(card(m)));
    }

    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("on");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => t.classList.remove("on"), 1200);
    }

    function openDetail(m) {
      $("dTitle").textContent = m.name_full || "";
      const sub = [];
      if (m.cas) sub.push("CAS " + m.cas);
      if (m.smiles) sub.push("SMILES 已收录");
      $("dSub").textContent = sub.join(" · ");

      $("dImg").src = m.img || "";
      $("dCas").textContent = m.cas || "-";
      $("dSmiles").textContent = m.smiles || "-";
      const tags = (m.tags || []).map(t => zhTag(t) + "（" + t + "）").join("、");
      $("dTags").textContent = tags || "-";

      $("mask").classList.add("on");
      $("mask").setAttribute("aria-hidden", "false");

      $("copyCas").onclick = async () => {
        if (!m.cas) return toast("无 CAS 可复制");
        await navigator.clipboard.writeText(m.cas);
        toast("已复制 CAS");
      };
      $("copySmiles").onclick = async () => {
        if (!m.smiles) return toast("无 SMILES 可复制");
        await navigator.clipboard.writeText(m.smiles);
        toast("已复制 SMILES");
      };
      $("copyTags").onclick = async () => {
        const txt = (m.tags || []).join(", ");
        if (!txt) return toast("无标签可复制");
        await navigator.clipboard.writeText(txt);
        toast("已复制标签");
      };
    }

    function closeDetail() {
      $("mask").classList.remove("on");
      $("mask").setAttribute("aria-hidden", "true");
    }

    // init
    setHeader();
    renderChips();
    render();

    $("q").addEventListener("input", (e) => {
      state.q = e.target.value;
      render();
    });
    $("reset").onclick = () => {
      state.q = "";
      state.tag = "";
      $("q").value = "";
      renderChips();
      render();
      toast("已重置");
    };

    $("close").onclick = closeDetail;
    $("mask").addEventListener("click", (e) => {
      if (e.target.id === "mask") closeDetail();
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeDetail();
    });
  </script>
</body>
</html>
